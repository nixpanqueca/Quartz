set timeout=1
set default=0

menuentry "Cubic System Software" {
    insmod all_video
    set gfxpayload=keep
    multiboot /boot/quartz.elf
    module /system/compiled/bitmap/face@2x.bmp system/compiled/bitmap/face@2x.bmp
    module /system/compiled/bitmap/floppy.bmp system/compiled/bitmap/floppy.bmp
    module /system/compiled/bitmap/floppy@2.bmp system/compiled/bitmap/floppy@2.bmp
    module /system/compiled/prism/bitmap/dock/ratioINNER.bmp system/compiled/prism/bitmap/dock/ratioINNER.bmp
    module /system/compiled/prism/bitmap/dock/ratioOUTTER.bmp system/compiled/prism/bitmap/dock/ratioOUTTER.bmp
    module /system/compiled/prism/bitmap/dock/tileT1.bmp system/compiled/prism/bitmap/dock/tileT1.bmp
    module /system/compiled/prism/bitmap/icon.bmp system/compiled/prism/bitmap/icon.bmp
    module /system/compiled/prism/bitmap/separator.bmp system/compiled/prism/bitmap/separator.bmp
    boot
}
